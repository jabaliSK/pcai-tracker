services:
  db:
    image: postgres:16-alpine
    container_name: pcai_db
    environment:
      POSTGRES_USER: pcai
      POSTGRES_PASSWORD: pcai
      POSTGRES_DB: pcai_tracker
    volumes:
      - pcai_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pcai -d pcai_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: pcai_backend
    environment:
      DATABASE_URL: postgresql+psycopg2://pcai:pcai@db:5432/pcai_tracker
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    container_name: pcai_frontend
    depends_on:
      - backend
    ports:
      - "8090:80"

volumes:
  pcai_pgdata:
